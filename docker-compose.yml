version: "3.9"

services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
    volumes:
      - ./data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./service_account.json}:/app/service_account.json:ro
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.headless true --server.address 0.0.0.0
    environment:
      - RAG_API_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
